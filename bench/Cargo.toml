[package]
name = "oxtel-bench"
description = "Benchmarks comparing oxtel with tracing-opentelemetry and the official OpenTelemetry Rust SDK"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
oxtel-sdk = { path = "../crates/oxtel-sdk" }
oxtel-otlp = { path = "../crates/oxtel-otlp" }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
opentelemetry = { version = "0.33", features = ["trace", "metrics", "logs", "experimental_metrics_bound_instruments"] }
opentelemetry_sdk = { version = "0.33", features = ["trace", "metrics", "logs", "experimental_metrics_bound_instruments"] }
opentelemetry-appender-tracing = "0.33"
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
cpu-time = "1.0"
prost = "0.14"
stats_alloc = "0.1"
tracing = "0.1.44"
tracing-opentelemetry = "0.34"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }

[dev-dependencies]
criterion = "0.8"

[[bench]]
name = "traces"
harness = false

[[bench]]
name = "metrics"
harness = false

[[bench]]
name = "logs"
harness = false
