[workspace]
resolver = "3"
members = ["crates/*", "xtask", "bench", "conformance", "examples"]

[workspace.package]
version = "0.4.1"
edition = "2024"
rust-version = "1.94"
license = "Apache-2.0"
repository = "https://github.com/agentstatelabs/oxtel"
homepage = "https://github.com/agentstatelabs/oxtel"
authors = ["AgentStateLabs <info@agentstatelabs.com>"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
# oxtel-tokio records tokio's unstable metrics when built with them.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(tokio_unstable)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
