name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      # Features the workspace build leaves off.
      - run: cargo clippy -p oxtel-tower --all-targets --features axum
      - run: cargo test -p oxtel-tower --features axum
      - run: cargo clippy -p oxtel-rmcp --all-targets --features client
      - run: cargo test -p oxtel-rmcp --features client
      - run: cargo clippy -p oxtel-semconv --all-targets --features experimental
      - run: cargo clippy -p oxtel-sql --all-targets --features rusqlite
      - run: cargo test -p oxtel-sql --features rusqlite
      # oxtel without its default features: local logs only.
      - run: cargo clippy -p oxtel --no-default-features --all-targets
      - run: cargo test -p oxtel --no-default-features
      - name: A logs-only build pulls in no HTTP or TLS crates
        shell: bash
        run: |
          tree=$(cargo tree -p oxtel --no-default-features -e normal --prefix none)
          # A tree that failed to print would pass the check below.
          grep -q '^tracing-subscriber v' <<<"$tree"
          if grep -E '^(ureq|rustls|hyper|reqwest|h2|tokio|native-tls|openssl|ring|aws-lc-rs|webpki|webpki-roots|flate2) v' <<<"$tree"; then
            echo "a logs-only build must not depend on these" >&2
            exit 1
          fi
      - name: With nothing configured, the logs example writes JSON lines
        shell: bash
        run: cargo run -q -p oxtel-examples --example logs 2>&1 >/dev/null | grep -F '"message":"signed in","user.id":42'
      - run: cargo doc --workspace --no-deps

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Each example builds with only the dependencies it documents
        run: cargo run -q -p xtask -- check-examples

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94
      - run: cargo check --workspace

  # The Prometheus exposition, checked by the tools that consume it:
  # promtool (parser and lints) for the classic text format, and the strict
  # OpenMetrics parser from prometheus-client for OpenMetrics.
  exposition:
    runs-on: ubuntu-latest
    env:
      PROMETHEUS_VERSION: "3.15.0"
      PROMETHEUS_CLIENT_VERSION: "0.26.0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install promtool (checksum-verified)
        run: |
          base="https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}"
          file="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          curl -fsSLO "${base}/${file}"
          curl -fsSLO "${base}/sha256sums.txt"
          grep " ${file}\$" sha256sums.txt | sha256sum -c -
          tar xzf "${file}" --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
      - name: Render both formats
        shell: bash
        run: |
          cargo run -q -p oxtel-prometheus --example exposition -- text > text.txt
          cargo run -q -p oxtel-prometheus --example exposition -- openmetrics > openmetrics.txt
          # An empty exposition would pass every check below.
          test -s text.txt && test -s openmetrics.txt
      - name: Classic text format passes promtool
        shell: bash
        run: ./promtool check metrics < text.txt
      - name: OpenMetrics passes a strict parser
        shell: bash
        run: |
          python3 -m pip install --quiet "prometheus-client==${PROMETHEUS_CLIENT_VERSION}"
          python3 scripts/check_openmetrics.py openmetrics.txt

  # oxtel's output, decoded by a real OpenTelemetry Collector: traces over
  # OTLP/HTTP (plain and gzip), and /metrics scraped by its Prometheus
  # receiver, checked through its file exporter. See conformance/README.md.
  collector:
    runs-on: ubuntu-latest
    env:
      COLLECTOR_VERSION: "0.161.0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the conformance tests
        run: cargo test -p oxtel-conformance --no-run
      - name: Start the Collector
        shell: bash
        run: |
          mkdir -p conformance/out && chmod 777 conformance/out
          docker run -d --name otelcol --network host \
            -v "$PWD/conformance/collector.yaml:/etc/otelcol-contrib/config.yaml:ro" \
            -v "$PWD/conformance/out:/out" \
            "otel/opentelemetry-collector-contrib:${COLLECTOR_VERSION}"
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:13133/ && exit 0
            sleep 1
          done
          echo "the Collector didn't become healthy"; docker logs otelcol; exit 1
      - name: Conformance
        run: cargo test -p oxtel-conformance -- --ignored --test-threads=1
      - name: Collector logs
        if: always()
        run: docker logs otelcol 2>&1 | tail -100

  # oxtel-semconv is generated: regenerating it with the pinned Weaver and
  # conventions must change nothing.
  semconv:
    runs-on: ubuntu-latest
    env:
      WEAVER_VERSION: "v0.26.1"
      WEAVER_SHA256: "1be79cca68925c09b6da04ef8a3875b563cf7c1dcd51cc5b7eff7d2edbb1a5dc"
    steps:
      - uses: actions/checkout@v7
      # The toolchain whose rustfmt formatted the committed code.
      - uses: dtolnay/rust-toolchain@1.94
        with:
          components: rustfmt
      - name: Install Weaver
        shell: bash
        run: |
          curl -sSfL -o "$RUNNER_TEMP/weaver.tar.xz" \
            "https://github.com/open-telemetry/weaver/releases/download/${WEAVER_VERSION}/weaver-x86_64-unknown-linux-gnu.tar.xz"
          echo "${WEAVER_SHA256}  $RUNNER_TEMP/weaver.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/weaver.tar.xz" -C "$RUNNER_TEMP"
          echo "WEAVER=$RUNNER_TEMP/weaver-x86_64-unknown-linux-gnu/weaver" >> "$GITHUB_ENV"
      - name: Regenerate
        run: cargo run -p xtask -- gen-semconv
      - name: The committed code is current
        run: git diff --exit-code crates/oxtel-semconv

  # Declarative configuration files, checked against the schema the
  # OpenTelemetry configuration project publishes.
  config-schema:
    runs-on: ubuntu-latest
    env:
      SCHEMA_VERSION: "v1.2.0"
    steps:
      - uses: actions/checkout@v7
      - name: Validate the example configuration files
        shell: bash
        run: |
          python3 -m pip install --user "check-jsonschema==0.29.4"
          curl -sSfL -o "$RUNNER_TEMP/schema.json" \
            "https://raw.githubusercontent.com/open-telemetry/opentelemetry-configuration/${SCHEMA_VERSION}/opentelemetry_configuration.json"
          ~/.local/bin/check-jsonschema --schemafile "$RUNNER_TEMP/schema.json" \
            examples/otel-config.yaml \
            crates/oxtel-config/tests/fixtures/otel-sdk-config.yaml \
            crates/oxtel-config/tests/fixtures/otel-getting-started.yaml

  # Coverage-guided fuzzing of the parsers that read other services'
  # requests (traceparent, tracestate, baggage) and configuration
  # (OTEL_RESOURCE_ATTRIBUTES, OTEL_EXPORTER_OTLP_HEADERS). Each target runs
  # for 60 s from the seed corpus; a crash uploads its input.
  fuzz:
    runs-on: ubuntu-latest
    env:
      CARGO_FUZZ_VERSION: "0.13.2"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version "${CARGO_FUZZ_VERSION}"
      - name: Fuzz each target for 60 s
        shell: bash
        run: |
          for target in $(cargo fuzz list); do
            echo "::group::${target}"
            cargo fuzz run "${target}" -- -max_total_time=60 -max_len=4096
            echo "::endgroup::"
          done
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts
