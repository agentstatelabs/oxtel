name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94
      - run: cargo check --workspace

  # The Prometheus exposition, checked by the tools that consume it:
  # promtool (parser and lints) for the classic text format, and the strict
  # OpenMetrics parser from prometheus-client for OpenMetrics.
  exposition:
    runs-on: ubuntu-latest
    env:
      PROMETHEUS_VERSION: "3.15.0"
      PROMETHEUS_CLIENT_VERSION: "0.26.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install promtool (checksum-verified)
        run: |
          base="https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}"
          file="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          curl -fsSLO "${base}/${file}"
          curl -fsSLO "${base}/sha256sums.txt"
          grep " ${file}\$" sha256sums.txt | sha256sum -c -
          tar xzf "${file}" --strip-components=1 "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool"
      - name: Render both formats
        shell: bash
        run: |
          cargo run -q -p oxtel-prometheus --example exposition -- text > text.txt
          cargo run -q -p oxtel-prometheus --example exposition -- openmetrics > openmetrics.txt
          # An empty exposition would pass every check below.
          test -s text.txt && test -s openmetrics.txt
      - name: Classic text format passes promtool
        shell: bash
        run: ./promtool check metrics < text.txt
      - name: OpenMetrics passes a strict parser
        shell: bash
        run: |
          python3 -m pip install --quiet "prometheus-client==${PROMETHEUS_CLIENT_VERSION}"
          python3 scripts/check_openmetrics.py openmetrics.txt

  # oxtel's output, decoded by a real OpenTelemetry Collector: traces over
  # OTLP/HTTP (plain and gzip), and /metrics scraped by its Prometheus
  # receiver, checked through its file exporter. See conformance/README.md.
  collector:
    runs-on: ubuntu-latest
    env:
      COLLECTOR_VERSION: "0.161.0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build the conformance tests
        run: cargo test -p oxtel-conformance --no-run
      - name: Start the Collector
        shell: bash
        run: |
          mkdir -p conformance/out && chmod 777 conformance/out
          docker run -d --name otelcol --network host \
            -v "$PWD/conformance/collector.yaml:/etc/otelcol-contrib/config.yaml:ro" \
            -v "$PWD/conformance/out:/out" \
            "otel/opentelemetry-collector-contrib:${COLLECTOR_VERSION}"
          for i in $(seq 1 30); do
            curl -sf -o /dev/null http://localhost:13133/ && exit 0
            sleep 1
          done
          echo "the Collector didn't become healthy"; docker logs otelcol; exit 1
      - name: Conformance
        run: cargo test -p oxtel-conformance -- --ignored --test-threads=1
      - name: Collector logs
        if: always()
        run: docker logs otelcol 2>&1 | tail -100
