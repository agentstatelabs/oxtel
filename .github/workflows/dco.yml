name: DCO

# Every commit in a pull request must carry a Signed-off-by line matching
# its author (the Developer Certificate of Origin; see CONTRIBUTING.md).
# Merge commits and Dependabot's commits are exempt.
on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check sign-offs
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "${BASE}..${HEAD}"); do
            author_email=$(git log -1 --format='%ae' "$sha")
            author_name=$(git log -1 --format='%an' "$sha")
            case "$author_name" in *"[bot]") continue ;; esac
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -qiF "<${author_email}>"; then
              echo "::error::${sha} by ${author_name} <${author_email}> has no matching Signed-off-by line"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Sign off each commit with 'git commit -s' (amend with 'git commit --amend -s' or 'git rebase --signoff')."
            exit 1
          fi
          echo "Every commit is signed off."
