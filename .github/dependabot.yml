version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      opentelemetry-comparison:
        patterns: ["opentelemetry*", "tracing-opentelemetry"]
  - package-ecosystem: cargo
    directory: /fuzz
    schedule:
      interval: monthly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      # The toolchain is chosen by its ref: `stable`, or the MSRV (`1.94`),
      # which changes only by policy. These refs aren't versions to bump.
      - dependency-name: dtolnay/rust-toolchain
