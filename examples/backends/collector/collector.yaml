# Takes OTLP from your programs, and prints what arrives. To pass it on to
# a backend as well, add the backend's exporter, such as the `otlphttp` one
# below, and list it in each pipeline's exporters.
extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

exporters:
  debug:
    verbosity: detailed
  # otlphttp:
  #   endpoint: https://otlp.example.com
  #   headers:
  #     Authorization: Bearer ${env:BACKEND_TOKEN}

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [debug]
    metrics:
      receivers: [otlp]
      exporters: [debug]
    logs:
      receivers: [otlp]
      exporters: [debug]
