# Elasticsearch, with Elastic's APM Server taking OTLP on 8200 (HTTP and
# gRPC), and Kibana on http://localhost:5601 to look at what arrives.
# Security is off: for trying it out on your own machine only.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "9200:9200"
  apm-server:
    image: docker.elastic.co/apm/apm-server:9.5.6
    command:
      - -e
      - -E
      - apm-server.host=0.0.0.0:8200
      - -E
      - output.elasticsearch.hosts=["http://elasticsearch:9200"]
    ports:
      - "8200:8200"
    depends_on: [elasticsearch]
  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.6
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on: [elasticsearch]
