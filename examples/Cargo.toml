[package]
name = "oxtel-examples"
description = "Runnable examples for oxtel"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
metrics = "0.24"
oxtel-otlp = { path = "../crates/oxtel-otlp" }
oxtel-prometheus = { path = "../crates/oxtel-prometheus" }
oxtel-sdk = { path = "../crates/oxtel-sdk" }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std", "fmt"] }

[[example]]
name = "quickstart"
path = "quickstart.rs"
