# An OpenTelemetry Collector as a gateway: one Deployment that every pod
# sends to, through its Service at otel-collector:4318. It prints what
# arrives; add your backend's exporter to its configuration to send it on.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318
          grpc:
            endpoint: 0.0.0.0:4317
    exporters:
      debug:
        verbosity: detailed
      # To send on to a backend, add its exporter, with the key from the
      # BACKEND_TOKEN variable below, and list it in each pipeline.
      # otlphttp:
      #   endpoint: https://otlp.example.com
      #   headers:
      #     Authorization: Bearer ${env:BACKEND_TOKEN}
    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          exporters: [debug]
        logs:
          receivers: [otlp]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector
  template:
    metadata:
      labels:
        app: otel-collector
    spec:
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.161.0
          args: [--config=/etc/otelcol/config.yaml]
          env:
            # The backend's key, from a Secret you make with
            # kubectl create secret generic backend --from-literal=token=...
            # Optional, so the Collector starts before there's one.
            - name: BACKEND_TOKEN
              valueFrom:
                secretKeyRef:
                  name: backend
                  key: token
                  optional: true
          ports:
            - containerPort: 4318
            - containerPort: 4317
          readinessProbe:
            httpGet:
              path: /
              port: 13133
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
      volumes:
        - name: config
          configMap:
            name: otel-collector
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
spec:
  selector:
    app: otel-collector
  ports:
    - name: otlp-http
      port: 4318
    - name: otlp-grpc
      port: 4317
