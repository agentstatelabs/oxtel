# The service example, sending everything to the Collector gateway. oxtel
# finds the namespace and the pod's name itself; the downward API passes in
# what the pod can't see.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
        - name: shop
          # Your image here.
          image: oxtel-service:example
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_SERVICE_NAME
              value: shop
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector:4318
            # The node the pod runs on, for k8s.node.name.
            - name: K8S_NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            # The pod's UID, for k8s.pod.uid, and what the deployment is
            # called, neither of which the pod can find out for itself.
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: k8s.pod.uid=$(POD_UID),k8s.deployment.name=shop
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: shop
spec:
  selector:
    app: shop
  ports:
    - port: 80
      targetPort: 8080
