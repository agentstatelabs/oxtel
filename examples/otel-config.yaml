# An OpenTelemetry declarative configuration file oxtel reads, with
# OTEL_CONFIG_FILE=examples/otel-config.yaml. Everything oxtel acts on is
# here; CI checks it against the published 1.2 schema. Values can come from
# the environment: ${NAME}, or ${NAME:-default}.
file_format: "1.2"
disabled: false

resource:
  attributes:
    - name: service.name
      value: checkout
    - name: deployment.environment.name
      value: ${DEPLOYMENT_ENVIRONMENT:-development}
  detection/development:
    detectors:
      - service:
      - host:
      - os:
      - process:
      - container:

attribute_limits:
  attribute_count_limit: 128

propagator:
  composite:
    - tracecontext:
    - baggage:

tracer_provider:
  sampler:
    parent_based:
      root:
        trace_id_ratio_based:
          ratio: 0.25
  limits:
    event_count_limit: 128
    link_count_limit: 128
  processors:
    - batch:
        schedule_delay: 5000
        max_queue_size: 2048
        exporter:
          otlp_http:
            endpoint: http://localhost:4318/v1/traces
            compression: gzip
            headers:
              - name: x-tenant
                value: ${TENANT:-default}

meter_provider:
  exemplar_filter: trace_based
  readers:
    # ANCHOR: delta
    - periodic:
        interval: 60000
        exporter:
          otlp_http:
            endpoint: http://localhost:4318/v1/metrics
            encoding: json
            # Deltas and exponential histograms, for this exporter only:
            # the Prometheus endpoint below keeps its totals and buckets.
            temporality_preference: delta
            default_histogram_aggregation: base2_exponential_bucket_histogram
    # ANCHOR_END: delta
    - pull:
        exporter:
          prometheus/development:
            host: localhost
            port: 9464
  # ANCHOR: views
  views:
    # Request durations in fewer, wider buckets.
    - selector:
        instrument_name: http.server.request.duration
      stream:
        aggregation:
          explicit_bucket_histogram:
            boundaries: [0.01, 0.05, 0.1, 0.5, 1, 5]
    # Statement durations without the statement's summary, so there's one
    # series per database instead of one per statement.
    - selector:
        instrument_name: db.client.operation.duration
      stream:
        attribute_keys:
          excluded: [db.query.summary]
    # Nothing from the cache's instruments.
    - selector:
        instrument_name: cache.*
      stream:
        aggregation:
          drop:
  # ANCHOR_END: views

logger_provider:
  processors:
    - batch:
        exporter:
          otlp_http:
            endpoint: http://localhost:4318/v1/logs
    - simple:
        exporter:
          console:
