[package]
name = "oxtel-rmcp"
description = "MCP server and client instrumentation for rmcp, following the OpenTelemetry semantic conventions for MCP"
readme = "../../README.md"
keywords = ["opentelemetry", "mcp", "rmcp", "tracing", "genai"]
categories = ["development-tools::debugging", "development-tools::profiling"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = []
# Instrument requests a client sends.
client = ["rmcp/client"]

[dependencies]
oxtel-sdk = { path = "../oxtel-sdk", version = "0.0.1" }
http = "1.4"
metrics = "0.24"
rmcp = { version = "1.6", default-features = false, features = ["server"] }
serde = "1"
serde_json = "1"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[dev-dependencies]
rmcp = { version = "1.6", default-features = false, features = ["server", "client"] }
tokio = { version = "1", features = ["macros", "rt", "io-util"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }

[lints]
workspace = true
