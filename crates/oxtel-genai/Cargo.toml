[package]
name = "oxtel-genai"
description = "GenAI model call spans, token usage and duration metrics, following the OpenTelemetry GenAI semantic conventions"
readme = "../../README.md"
keywords = ["opentelemetry", "genai", "llm", "tracing", "metrics"]
categories = ["development-tools::debugging"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
metrics = "0.24"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[dev-dependencies]
oxtel-sdk = { path = "../oxtel-sdk" }
oxtel-semconv = { path = "../oxtel-semconv", features = ["experimental"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }

[lints]
workspace = true
