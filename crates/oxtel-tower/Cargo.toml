[package]
name = "oxtel-tower"
description = "HTTP server and client instrumentation for tower, axum and hyper, following the OpenTelemetry semantic conventions"
readme = "../../README.md"
keywords = ["opentelemetry", "tower", "axum", "tracing", "http"]
categories = ["development-tools::debugging", "web-programming::http-server", "web-programming::http-client"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[features]
default = []
# Take `http.route` from axum's `MatchedPath`.
axum = ["dep:axum"]

[dependencies]
oxtel-sdk = { path = "../oxtel-sdk", version = "0.0.1", features = ["http"] }
oxtel-prometheus = { path = "../oxtel-prometheus", version = "0.0.1" }
axum = { version = "0.8", default-features = false, features = ["matched-path"], optional = true }
http = "1.4"
metrics = "0.24"
pin-project-lite = "0.2"
tower-layer = "0.3"
tower-service = "0.3"
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

[dev-dependencies]
oxtel-semconv = { path = "../oxtel-semconv", features = ["experimental"] }
axum = { version = "0.8", default-features = false, features = ["matched-path", "tokio", "http1"] }
tokio = { version = "1", features = ["macros", "rt"] }
tower = { version = "0.5", default-features = false, features = ["util"] }
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }

[lints]
workspace = true
