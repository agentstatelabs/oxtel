[package]
name = "oxtel-otlp"
description = "OTLP/HTTP export for oxtel, with protobuf or JSON bodies"
readme = "../../README.md"
keywords = ["opentelemetry", "otlp", "tracing", "exporter", "telemetry"]
categories = ["development-tools::debugging", "development-tools::profiling"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
include = ["src/**", "proto/**", "Cargo.toml", "LICENSE"]

[features]
default = ["http-proto"]
# OTLP over HTTP with protobuf bodies: an HTTP client with rustls, and gzip.
http-proto = ["dep:ureq", "dep:flate2"]

[dependencies]
oxtel-sdk = { path = "../oxtel-sdk", version = "0.2.0" }
prost = "0.14"
fastrand = "2.4"
flate2 = { version = "1.1", optional = true }
ureq = { version = "3.4", default-features = false, features = ["rustls"], optional = true }

[dev-dependencies]
metrics = "0.24"
serde_json = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
flate2 = "1.1"

[lints]
workspace = true
