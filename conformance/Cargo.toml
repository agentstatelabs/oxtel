[package]
name = "oxtel-conformance"
description = "Conformance tests that send oxtel's output to a real OpenTelemetry Collector"
version = "0.0.0"
edition.workspace = true
license.workspace = true
publish = false

[dependencies]

[dev-dependencies]
oxtel-sdk = { path = "../crates/oxtel-sdk" }
oxtel-otlp = { path = "../crates/oxtel-otlp" }
oxtel-prometheus = { path = "../crates/oxtel-prometheus" }
metrics = "0.24"
serde_json = "1"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["registry", "std"] }
