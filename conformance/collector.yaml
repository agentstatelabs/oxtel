# The OpenTelemetry Collector used by oxtel's conformance tests.
# Run with host networking so it can scrape the tests' /metrics on
# localhost:9464, and mount a writable directory at /out.

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
  # OTLP/JSON lines, as oxtel's file exporter writes them: one file per
  # signal, which the tests write under /out/in.
  otlpjsonfile/traces:
    include: [/out/in/traces-*.jsonl]
    start_at: beginning
  otlpjsonfile/metrics:
    include: [/out/in/metrics-*.jsonl]
    start_at: beginning
  otlpjsonfile/logs:
    include: [/out/in/logs-*.jsonl]
    start_at: beginning
  prometheus:
    config:
      scrape_configs:
        - job_name: oxtel
          scrape_interval: 1s
          scrape_timeout: 900ms
          static_configs:
            - targets: ["localhost:9464"]

exporters:
  file/traces:
    path: /out/traces.json
    flush_interval: 100ms
  file/metrics:
    path: /out/metrics.json
    flush_interval: 100ms
  file/logs:
    path: /out/logs.json
    flush_interval: 100ms

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp, otlpjsonfile/traces]
      exporters: [file/traces]
    metrics:
      receivers: [prometheus, otlp, otlpjsonfile/metrics]
      exporters: [file/metrics]
    logs:
      receivers: [otlp, otlpjsonfile/logs]
      exporters: [file/logs]
